# Default configuration for Hands-On ML experiments
# Environment variables can be substituted with ${VAR_NAME} syntax

project:
  name: "hands-on-ml"
  version: "0.1.0"

paths:
  data_dir: "data"
  raw_data: "data/raw"
  processed_data: "data/processed"
  models_dir: "models"
  logs_dir: "logs"

# MNIST experiment configuration
mnist:
  data_file: "mnist_784.csv.zip"
  test_size: 0.2
  random_state: 42

  model:
    name: "knn"
    params:
      n_neighbors: 3
      weights: "distance"

  hyperparameter_search:
    enabled: true
    cv_folds: 4
    param_grid:
      n_neighbors: [3, 5, 7, 9, 10]
      weights: ["uniform", "distance"]

  augmentation:
    enabled: true
    shifts:
      - [1, 0]   # right
      - [-1, 0]  # left
      - [0, 1]   # down
      - [0, -1]  # up

# Titanic experiment configuration
titanic:
  download_url: "https://homl.info/titanic.tgz"

  features:
    numerical: ["Age", "SibSp", "Parch", "Fare"]
    categorical: ["Pclass", "Sex", "Embarked"]

  models:
    - name: "random_forest"
      params:
        n_estimators: 100
        random_state: 42
    - name: "svm"
      params:
        gamma: "auto"
    - name: "knn"
      params:
        n_neighbors: 5

  cross_validation:
    cv_folds: 10
    scoring: "accuracy"

# Training settings
training:
  random_state: 42
  n_jobs: -1  # Use all CPU cores

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
